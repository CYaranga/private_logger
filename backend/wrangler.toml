name = "private-logger-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "private_logs_db"
database_id = "567469d3-8e51-47aa-88a3-4999c21c16cf"

[[d1_databases]]
binding = "ANALYTICS_DB"
database_name = "behaviour_analytics_db"
database_id = "9d840898-837c-4667-ae32-12f348a7f713"

# Run archiving daily at 3:00 AM UTC
[triggers]
crons = ["0 3 * * *"]

[[r2_buckets]]
binding = "SCREENSHOTS"
bucket_name = "private-logger-bug-screenshots"
